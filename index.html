<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Andre Vasconcelos's Goal Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--surface:#141418;--surface2:#1c1c22;--surface3:#24242c;--border:#2a2a34;--text:#e8e8ed;--text2:#9898a8;--text3:#68687a;--accent:#22c55e;--accent2:#16a34a;--accent-glow:rgba(34,197,94,.15);--blue:#3b82f6;--orange:#f97316;--purple:#a855f7;--red:#ef4444;--yellow:#eab308;--pink:#ec4899;--cyan:#06b6d4;--radius:16px;--radius-sm:10px;--radius-xs:6px}
*{margin:0;padding:0;box-sizing:border-box}html{overflow-x:hidden}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-text-size-adjust:100%}::selection{background:var(--accent);color:var(--bg)}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.hero{position:relative;padding:48px 24px 32px;text-align:center;overflow:hidden}.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 50% 0%,var(--accent-glow),transparent);pointer-events:none}.hero h1{font-size:clamp(1.6rem,4.5vw,2.6rem);font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),#86efac);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.hero p{color:var(--text2);font-size:.88rem}
.nav-wrap{position:sticky;top:0;z-index:100;background:rgba(10,10,12,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 12px}.nav{display:flex;gap:3px;overflow-x:auto;max-width:900px;margin:0 auto;padding:8px 0;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex-shrink:0;background:transparent;border:none;color:var(--text3);font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:500;padding:7px 14px;border-radius:var(--radius-xs);cursor:pointer;transition:all .2s;white-space:nowrap}.nav button:hover{color:var(--text);background:var(--surface)}.nav button.active{color:var(--bg);background:var(--accent);font-weight:600}
.main{max-width:900px;margin:0 auto;padding:20px 14px 100px}.tab-content{display:none;animation:fadeUp .35s ease}.tab-content.active{display:block}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;overflow:hidden;transition:border-color .2s}.card:hover{border-color:rgba(34,197,94,.3)}.card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.card-header .icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}.card-header h3{font-size:1rem;font-weight:700;flex:1;min-width:0}.card-header .tag{font-size:.65rem;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.exercise{border-bottom:1px solid var(--border);padding:12px 0}.exercise:last-child{border-bottom:none}
.ex-top{display:grid;grid-template-columns:34px 34px 1fr auto;gap:8px;align-items:center}
.exercise .num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;flex-shrink:0}
.exercise .ex-thumb{width:34px;height:34px;border-radius:6px;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}.ex-thumb img{width:100%;height:100%;object-fit:cover}
.exercise .info h4{font-size:.88rem;font-weight:600;margin-bottom:1px}.exercise .info .muscle{color:var(--text3);font-size:.72rem}.exercise .sets-col{text-align:right;display:flex;flex-direction:column;gap:2px}.exercise .sets{font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:500;color:var(--accent);white-space:nowrap}.exercise .info .note{color:var(--text2);font-size:.72rem;font-style:italic;margin-top:1px}
.exercise .weight-input{font-family:'JetBrains Mono',monospace;font-size:.68rem;width:54px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--yellow);text-align:center;outline:none}.exercise .weight-input:focus{border-color:var(--yellow)}
.ex-media{margin-top:8px}.ex-media .yt-lite{position:relative;width:100%;max-width:280px;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;background:#000;border:1px solid var(--border)}.yt-lite img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .3s}.yt-lite:hover img{opacity:1}.yt-lite .yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.yt-play span{width:44px;height:30px;background:rgba(255,0,0,.85);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff}.yt-lite:hover .yt-play span{background:red}.yt-lite iframe{position:absolute;inset:0;width:100%;height:100%;border:none}.yt-label{font-size:.62rem;color:var(--text3);margin-top:3px}
.superset-label{display:inline-flex;align-items:center;gap:5px;background:var(--accent-glow);border:1px solid rgba(34,197,94,.3);color:var(--accent);font-size:.65rem;font-weight:600;padding:3px 9px;border-radius:20px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.meal{display:grid;grid-template-columns:48px 1fr;gap:0 12px;padding:12px 0;border-bottom:1px solid var(--border)}.meal:last-child{border-bottom:none}.meal .time-col{display:flex;flex-direction:column;align-items:center;gap:3px}.meal .time-emoji{font-size:1.1rem}.meal .time{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text3)}.meal .meal-info h4{font-size:.85rem;font-weight:600;margin-bottom:3px}.meal .meal-info p{color:var(--text2);font-size:.78rem;line-height:1.55}.meal .macros{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.macro-tag{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:500;padding:2px 6px;border-radius:4px;background:var(--surface2)}.macro-tag.p{color:#22c55e;border:1px solid rgba(34,197,94,.2)}.macro-tag.c{color:#3b82f6;border:1px solid rgba(59,130,246,.2)}.macro-tag.f{color:#f97316;border:1px solid rgba(249,115,22,.2)}.macro-tag.kcal{color:#eab308;border:1px solid rgba(234,179,8,.2)}
.supp-grid{display:flex;flex-wrap:wrap;gap:6px}.supp-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:.72rem;font-weight:500;border:1px solid var(--border);background:var(--surface2)}.supp-pill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.supp-pill.new::after{content:'NOVO';font-size:.5rem;font-weight:700;color:var(--orange);background:rgba(249,115,22,.15);padding:1px 4px;border-radius:3px;margin-left:2px}
.phase-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;overflow:hidden}.phase-card h4{font-size:.85rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.phase-card .phase-badge{font-size:.6rem;padding:2px 7px;border-radius:12px;font-weight:600}.phase-card p{color:var(--text2);font-size:.78rem;line-height:1.55}
.pace-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.75rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.pace-table table{min-width:360px}.pace-table th{text-align:left;padding:6px 10px;background:var(--surface3);color:var(--accent);font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}.pace-table td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap}.pace-table tr:last-child td{border-bottom:none}
.section-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);padding:16px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px}
.finisher{background:linear-gradient(135deg,rgba(249,115,22,.1),rgba(239,68,68,.1));border:1px solid rgba(249,115,22,.2);border-radius:var(--radius-sm);padding:12px 14px;margin-top:10px}.finisher h4{color:var(--orange);font-size:.8rem;font-weight:700;margin-bottom:3px}.finisher p{color:var(--text2);font-size:.78rem}
.warmup{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(6,182,212,.08));border:1px solid rgba(34,197,94,.2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px}.warmup h4{color:var(--accent);font-size:.8rem;font-weight:700;margin-bottom:3px}.warmup p{color:var(--text2);font-size:.78rem}
.daily-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.72rem;font-weight:500;margin:0 4px 8px 0}
.alcohol-note{background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(236,72,153,.08));border:1px solid rgba(168,85,247,.2);border-radius:var(--radius-sm);padding:12px 14px;margin-top:10px}.alcohol-note h4{color:var(--purple);font-size:.8rem;font-weight:700;margin-bottom:3px}.alcohol-note p{color:var(--text2);font-size:.78rem;line-height:1.5}
/* Timer */
.timer-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;text-align:center}.timer-bar .timer-display{font-family:'JetBrains Mono',monospace;font-size:2.4rem;font-weight:700;color:var(--accent);margin:8px 0}.timer-bar .timer-btns{display:flex;gap:8px;justify-content:center;margin-top:10px}.timer-btn{padding:10px 24px;border-radius:var(--radius-sm);border:none;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}.timer-btn.start{background:var(--accent);color:var(--bg)}.timer-btn.start:hover{background:var(--accent2)}.timer-btn.stop{background:var(--red);color:#fff}.timer-btn.pause{background:var(--yellow);color:var(--bg)}.timer-btn.disabled{opacity:.4;pointer-events:none}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}.cal-header{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--text3);text-align:center;padding:4px 0}.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;border:1px solid var(--border);background:var(--surface2);color:var(--text3);position:relative}.cal-day.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--accent)}.cal-day.done::after{content:'✓';position:absolute;font-size:.5rem;bottom:1px;right:3px;color:var(--accent)}.cal-day.today{border-color:var(--accent);box-shadow:0 0 8px rgba(34,197,94,.3)}.cal-day.empty{border:none;background:none}
/* Swap btn */
.swap-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.72rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif}.swap-btn:hover{border-color:var(--accent);color:var(--accent)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:400px;width:100%}.modal h3{font-size:1rem;font-weight:700;margin-bottom:14px}.modal-opt{display:block;width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;margin-bottom:8px;text-align:left;transition:all .2s}.modal-opt:hover{border-color:var(--accent);color:var(--accent)}.modal-close{display:block;width:100%;padding:10px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text3);font-family:'Outfit',sans-serif;font-size:.82rem;cursor:pointer;margin-top:8px}
/* Quiz */
.quiz-card{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(168,85,247,.08));border:1px solid rgba(34,197,94,.3);border-radius:var(--radius);padding:20px;text-align:center;margin-top:14px}.quiz-card h4{font-size:.92rem;font-weight:700;margin-bottom:12px}.quiz-opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.quiz-opt{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.2rem;cursor:pointer;transition:all .2s;min-width:60px}.quiz-opt:hover{border-color:var(--accent);transform:scale(1.1)}.quiz-opt.selected{border-color:var(--accent);background:var(--accent-glow)}
/* Prize */
.prize-banner{background:linear-gradient(135deg,rgba(234,179,8,.15),rgba(249,115,22,.15));border:2px solid rgba(234,179,8,.5);border-radius:var(--radius);padding:20px;text-align:center;margin:14px 0;animation:pulse 2s infinite}.prize-banner h4{font-size:1.1rem;font-weight:800;color:var(--yellow);margin-bottom:4px}.prize-banner p{color:var(--text2);font-size:.85rem}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,.2)}50%{box-shadow:0 0 20px 4px rgba(234,179,8,.15)}}
/* Editable field */
.edit-val{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;width:60px;padding:4px 6px;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--accent);text-align:center;outline:none;transition:border-color .2s}.edit-val:focus{border-color:var(--accent);border-style:solid}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;cursor:pointer;transition:all .25s}.week-card:hover{border-color:var(--accent);transform:translateY(-2px)}.week-card .wday{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px}.week-card .wemoji{font-size:1.3rem;margin-bottom:4px}.week-card .wlabel{font-size:.68rem;font-weight:600}
.sleep-item{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}.sleep-item:last-child{border-bottom:none}.sleep-item .sleep-time{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;color:var(--purple)}.sleep-item p{color:var(--text2);font-size:.78rem;line-height:1.5}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:700px){.week-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:450px){.week-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
.hero{padding:32px 14px 20px}.hero h1{font-size:1.5rem}
.card{padding:14px;border-radius:12px}.card-header h3{font-size:.9rem}
.ex-top{grid-template-columns:28px 28px 1fr auto}.exercise .num{width:26px;height:26px;font-size:.65rem}.ex-thumb{width:28px!important;height:28px!important}.exercise .info h4{font-size:.8rem}.exercise .sets{font-size:.72rem}
.yt-lite{max-width:100%!important}
.phase-card{padding:10px}.phase-card p{font-size:.72rem}
.meal{grid-template-columns:42px 1fr;gap:0 8px}.meal .time-emoji{font-size:1rem}.meal .time{font-size:.55rem}.meal .meal-info h4{font-size:.8rem}.meal .meal-info p{font-size:.72rem}.macro-tag{font-size:.55rem;padding:2px 5px}
.supp-pill{padding:3px 7px;font-size:.65rem}
.timer-bar .timer-display{font-size:2rem}
.cal-day{font-size:.6rem}
.nav button{padding:5px 10px;font-size:.72rem}
.warmup,.finisher,.alcohol-note{padding:10px 12px}
}
</style>
</head>
<body>
<div class="hero">
  <h1>ANDRE VASCONCELOS'S GOAL PLAN</h1>
  <p>Treino · Dieta · Suplementos · Gamificação</p>
</div>
<div class="nav-wrap"><div class="nav" id="nav"></div></div>
<div class="main" id="main"></div>
<div id="modal-root"></div>

<script>
// ===== DATA STORE (localStorage) =====
const LS={
  get(k,d){try{const v=localStorage.getItem('gp_'+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem('gp_'+k,JSON.stringify(v))}catch{}}
};
let STATE={
  weight:LS.get('weight',72),
  goalWeight:LS.get('goalWeight',68),
  workouts:LS.get('workouts',{}),// {dateStr:{done:true,type:'upper',duration:1234,feeling:'💪'}}
  exWeights:LS.get('exWeights',{}),// {'Supino com Halteres':'14kg'}
  daySwaps:LS.get('daySwaps',{}),// {'sab':'corrida'}
};
function save(){Object.keys(STATE).forEach(k=>LS.set(k,STATE[k]))}

// ===== YOUTUBE IDs =====
const YT={
  'Supino com Halteres':'VmB1G1K7v94','Remada Unilateral no Banco':'roCP6wCXPqo',
  'Shoulder Press':'qEwKCR5JCog','Face Pull':'rep-qVOkqgk',
  'Rosca Bíceps':'ykJmrZ5v0Oo','Tríceps Corda':'2-LAMcpzODU',
  'Leg Press Horizontal':'IZxyjW7MPJQ','Stiff com Halteres':'jEy_czb3RKA',
  'Bulgarian Split Squat':'2C-uNgKwPLE','Hip Thrust':'SEdqd1n0cvg',
  'Panturrilha em Pé':'gwLzBJYoWlI','Prancha Frontal':'ASdvN_XEl_c',
  'Russian Twist':'wkD8rjkodUI','Goblet Squat':'MeIiIdhvXT4',
  'Push-Up':'IODxDxX7oi4','Remada Unilateral':'pYcpY20QaE8',
  'Lunge Reverso':'xrPteyQLGAo','Mountain Climbers':'nmwgirgXLYM',
  'Chest Fly':'Iwe6AmxVf7o','Thruster':'M030vFO5mKg',
  'TRX Row':'VjbxqPMDuKI','Prancha c/ Shoulder Tap':'wcEkN-FkBCA'
};

// Schedule: new order
const SCHEDULE={
  seg:{type:'upper',emoji:'💪',label:'Upper Body',color:'#22c55e'},
  ter:{type:'corrida',emoji:'🏃',label:'Corrida',color:'#3b82f6'},
  qua:{type:'lower',emoji:'🦵',label:'Lower + Core',color:'#22c55e'},
  qui:{type:'corrida',emoji:'🏃',label:'Corrida',color:'#3b82f6'},
  sex:{type:'off',emoji:'🛋️',label:'OFF',color:'#68687a'},
  sab:{type:'full',emoji:'⚡',label:'Full Body',color:'#f97316'},
  dom:{type:'off',emoji:'🛋️',label:'OFF',color:'#68687a'},
};
const SWAP_OPTIONS=['upper','corrida','lower','full','off'];
const SWAP_LABELS={upper:'💪 Upper Body',corrida:'🏃 Corrida',lower:'🦵 Lower Body',full:'⚡ Full Body',off:'🛋️ OFF'};

// Nav tabs
const TABS=[
  {id:'home',label:'🏠 Home'},
  {id:'treino',label:'🏋️ Treinos'},
  {id:'alimentacao',label:'🍽️ Alimentação'},
  {id:'suplementos',label:'💊 Suplementos'},
  {id:'diadia',label:'📅 Dia a Dia'},
  {id:'metas',label:'🎯 Metas'},
  {id:'sleep',label:'😴 Sono'},
];

// Supp data
const S_FAST=[{n:'SAMe 400mg',note:'jejum'}];
const S_BRK=[{n:'Omega-3 Plus'},{n:'CoQ10 Ubiquinol 100mg'},{n:'Vitamin K2 (MK-7)'},{n:'Curcumin Elite'},{n:'Multi One-Per-Day'},{n:'Pycnogenol 100mg'},{n:'L-Carnitine 500mg'},{n:'B12 1mg',note:'sublingual'},{n:'Optimized Folate'},{n:'Quick Brain Nootropic'},{n:'Digest Complete'},{n:'L-Theanine 200mg',note:'com café',nw:1},{n:'Creatina 5g'}];
const S_LUN=[{n:'Berberine 500mg',nw:1}];
const S_NIT=[{n:'Neuro-Mag (Mg L-Threonate)'},{n:'Ashwagandha'},{n:'NAC 600mg'},{n:'Glutathione, Cysteine & C'},{n:'Citicoline'},{n:'Berberine 500mg (2ª dose)',nw:1}];

const sp=(ss,c='#22c55e')=>`<div class="supp-grid">${ss.map(s=>`<span class="supp-pill${s.nw?' new':''}"><span class="dot" style="background:${c}"></span>${s.n}${s.note?` <span style="color:var(--text3);font-size:.55rem">(${s.note})</span>`:''}</span>`).join('')}</div>`;

// ===== HELPER: exercise block =====
function ex(num,name,sets,muscles,note='',color='var(--accent)'){
  const ytId=YT[name]||'';
  const thumb=ytId?`https://img.youtube.com/vi/${ytId}/mqdefault.jpg`:'';
  const uid='yt_'+Math.random().toString(36).substr(2,6);
  const savedW=STATE.exWeights[name]||'';
  return `<div class="exercise">
    <div class="ex-top">
      <div class="num" style="background:${color}22;color:${color}">${num}</div>
      ${thumb?`<div class="ex-thumb"><img src="${thumb}" alt="${name}" loading="lazy"></div>`:'<div></div>'}
      <div class="info"><h4>${name}</h4><div class="muscle">${muscles}</div>${note?`<div class="note">${note}</div>`:''}</div>
      <div class="sets-col"><div class="sets">${sets}</div><input class="weight-input" type="text" placeholder="lbs" value="${savedW}" onchange="saveWeight('${name.replace(/'/g,"\\'")}',this.value)" title="Peso usado"></div>
    </div>
    ${ytId?`<div class="ex-media">
      <div class="yt-lite" id="${uid}" onclick="loadYT(this,'${ytId}')"><img src="${thumb}" alt="${name}" loading="lazy"><div class="yt-play"><span>▶</span></div></div>
      <div class="yt-label">▶ Ver execução correta</div>
    </div>`:''}
  </div>`;

function ml(emoji,time,title,desc,macros){

// ===== TIMER =====
let timerInterval=null,timerStart=0,timerElapsed=0,timerRunning=false,timerDay='';
function fmtTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return `${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function startTimer(day){timerDay=day;timerStart=Date.now()-timerElapsed;timerRunning=true;timerInterval=setInterval(()=>{timerElapsed=Date.now()-timerStart;updateTimerDisplay()},1000);updateTimerDisplay()}
function pauseTimer(){clearInterval(timerInterval);timerRunning=false;updateTimerDisplay()}
function stopTimer(){
  clearInterval(timerInterval);timerRunning=false;
  const dateStr=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  const dayType=getEffectiveType(timerDay);
  STATE.workouts[dateStr]={done:true,type:dayType,duration:timerElapsed,feeling:''};
  save();timerElapsed=0;
  showQuiz(dateStr);
}
function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerElapsed=0;updateTimerDisplay()}
function quickCheck(dayId){
  const dateStr=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  STATE.workouts[dateStr]={done:true,type:getEffectiveType(dayId),duration:0,feeling:''};
  save();showQuiz(dateStr);
}
function updateTimerDisplay(){
  const el=document.getElementById('timer-display');
  if(el)el.textContent=fmtTime(timerElapsed);
  const startBtn=document.getElementById('timer-start');
  const pauseBtn=document.getElementById('timer-pause');
  const stopBtn=document.getElementById('timer-stop');
  if(startBtn)startBtn.className=`timer-btn ${timerRunning?'disabled':'start'}`;
  if(pauseBtn)pauseBtn.className=`timer-btn ${timerRunning?'pause':'disabled'}`;
  if(stopBtn)stopBtn.className=`timer-btn ${timerElapsed>0?'stop':'disabled'}`;
}

function showQuiz(dateStr){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><h3>Como foi o treino? 💬</h3>
      ${['😤 Pesado','💪 Ótimo','😊 Bom','😴 Leve','🤕 Dor'].map(f=>`<button class="modal-opt" onclick="saveFeeling('${dateStr}','${f}')">${f}</button>`).join('')}
      <button class="modal-close" onclick="closeModal()">Pular</button>
    </div></div>`;
}
function saveFeeling(d,f){STATE.workouts[d].feeling=f;save();closeModal();switchTab(currentTab)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}

function getEffectiveType(dayId){
  if(STATE.daySwaps[dayId])return STATE.daySwaps[dayId];
  return SCHEDULE[dayId]?.type||'off';
}
function getWeekWorkouts(){
  const now=new Date();
  const caStr=now.toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  const today=new Date(caStr);
  const dow=today.getDay(),mon=new Date(today);
  mon.setDate(today.getDate()-(dow===0?6:dow-1));
  let count=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=d.toISOString().slice(0,10);if(STATE.workouts[k]?.done)count++}
  return count;
}

function buildCalendar(){
  const now=new Date();
  const caStr=now.toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  const [cy,cm,cd]=[parseInt(caStr.slice(0,4)),parseInt(caStr.slice(5,7))-1,parseInt(caStr.slice(8,10))];
  const firstDay=new Date(cy,cm,1).getDay();
  const daysInMonth=new Date(cy,cm+1,0).getDate();
  const monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let html=`<div style="text-align:center;margin-bottom:8px;font-weight:700;font-size:.88rem">${monthNames[cm]} ${cy}</div>`;
  html+=`<div class="cal-grid">`;
  ['S','T','Q','Q','S','S','D'].forEach(d=>{html+=`<div class="cal-header">${d}</div>`});
  const offset=(firstDay+6)%7;
  for(let i=0;i<offset;i++)html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done=STATE.workouts[dateStr]?.done;
    const isToday=d===cd;
    html+=`<div class="cal-day${done?' done':''}${isToday?' today':''}" onclick="toggleCalDay('${dateStr}')" style="cursor:pointer">${d}</div>`;
  }
  html+=`</div>`;
  html+=`<p style="color:var(--text3);font-size:.62rem;text-align:center;margin-top:6px">Clica no dia pra marcar/desmarcar treino</p>`;
  return html;
}
function toggleCalDay(dateStr){
  if(STATE.workouts[dateStr]?.done){
    delete STATE.workouts[dateStr];save();renderTab(currentTab);
  } else {
    const root=document.getElementById('modal-root');
    root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal"><h3>Qual treino você fez?</h3>
        <button class="modal-opt" onclick="markCalDay('${dateStr}','upper')">💪 Upper Body</button>
        <button class="modal-opt" onclick="markCalDay('${dateStr}','lower')">🦵 Lower Body</button>
        <button class="modal-opt" onclick="markCalDay('${dateStr}','full')">⚡ Full Body</button>
        <button class="modal-opt" onclick="markCalDay('${dateStr}','corrida')">🏃 Corrida</button>
        <button class="modal-close" onclick="closeModal()">Cancelar</button>
      </div></div>`;
  }
}

  STATE.workouts[dateStr]={done:true,type:type,duration:0,feeling:''};

}

      <div style="font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text3)">${pct}%</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:100px;background:var(--surface2);border-radius:var(--radius-xs);padding:10px;text-align:center"><div style="font-size:.65rem;color:var(--text3);text-transform:uppercase">Total treinos</div><div style="font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--accent)">${totalWorkouts}</div></div>
      <div style="flex:1;min-width:100px;background:var(--surface2);border-radius:var(--radius-xs);padding:10px;text-align:center"><div style="font-size:.65rem;color:var(--text3);text-transform:uppercase">Sequência</div><div style="font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--orange)">${streak} 🔥</div></div>
    </div>
  </div>
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(168,85,247,.12)">📅</div><h3>Calendário</h3></div>${buildCalendar()}</div>
  <div class="section-title">Semana</div>
  <div class="week-grid">${['seg','ter','qua','qui','sex','sab','dom'].map(d=>{
    const eff=getEffectiveType(d);
    const info=SCHEDULE[d];
    const effLabel=SWAP_LABELS[eff]||info.label;
    const swapped=STATE.daySwaps[d];
    return `<div class="week-card" onclick="switchTab('diadia','${d}')">
      <div class="wday">${d.toUpperCase()}</div><div class="wemoji">${{upper:'💪',corrida:'🏃',lower:'🦵',full:'⚡',off:'🛋️'}[eff]}</div>
      <div class="wlabel" style="color:${info.color}">${effLabel.replace(/^[^\s]+ /,'')}</div>
      ${swapped?'<div style="font-size:.5rem;color:var(--orange)">trocado</div>':''}
    </div>`}).join('')}</div>`;
}

function calcStreak(){
  let streak=0;const now=new Date();
  for(let i=0;i<60;i++){const d=new Date(now);d.setDate(now.getDate()-i);const k=d.toISOString().slice(0,10);const dow=d.getDay();
    if(dow===0||dow===5){continue}// skip OFF days (sex=5, dom=0)
    if(STATE.workouts[k]?.done)streak++;else if(i>0)break;
  }
  return streak;
}

// ===== TAB: TREINO =====
let treinoDay='seg';
function buildTreino(){
  const days=['seg','ter','qua','qui','sab'];
  const dayLabels={seg:'SEG',ter:'TER',qua:'QUA',qui:'QUI',sab:'SÁB'};
  const d=treinoDay;
  const eff=getEffectiveType(d);
  const dayFull={seg:'Segunda',ter:'Terça',qua:'Quarta',qui:'Quinta',sab:'Sábado'}[d];
  return `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px">
    ${days.map(dd=>{const e=getEffectiveType(dd);const sel=dd===d;return `<div onclick="treinoDay='${dd}';renderTab('treino')" style="cursor:pointer;padding:10px 4px;border-radius:var(--radius-sm);border:2px solid ${sel?'var(--accent)':'var(--border)'};background:${sel?'var(--accent-glow)':'var(--surface)'};text-align:center;transition:all .2s">
      <div style="font-size:1.2rem;margin-bottom:4px">${{upper:'💪',corrida:'🏃',lower:'🦵',full:'⚡',off:'🛋️'}[e]}</div>
      <div style="font-size:.72rem;font-weight:700;color:${sel?'var(--accent)':'var(--text3)'}">${dayLabels[dd]}</div>
      <div style="font-size:.58rem;color:var(--text3);margin-top:2px">${SWAP_LABELS[e].replace(/^[^\s]+ /,'')}</div>
    </div>`}).join('')}</div>
  <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:.88rem;font-weight:700">${dayFull}</span>${buildSwapBtn(d)}</div>
  ${buildTimerBar(d)}
  ${getWorkoutContent(eff,d)}`;
}

// ===== TAB: ALIMENTAÇÃO =====

  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(59,130,246,.12)">🏃</div><h3>Dia de Corrida</h3><span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">~2.150 kcal</span></div>${MEALS_RUN}</div>
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(104,104,122,.12)">🛋️</div><h3>Dia OFF (Low Carb)</h3><span class="tag" style="background:rgba(104,104,122,.15);color:var(--text3)">~1.900 kcal</span></div>${MEALS_OFF}</div>
  <div class="alcohol-note"><h4>🍷 Álcool (Sex/Sáb)</h4><p>Vinho tinto ou destilado. Max 1-2 doses. Proteína antes. 1 copo água entre doses. Dormir 30min mais cedo.</p></div>`;
}

// ===== TAB: SUPLEMENTOS =====
function buildSupplementos(){
  return `<div class="card"><div class="card-header"><div class="icon" style="background:rgba(234,179,8,.12)">☀️</div><h3>Jejum — 7 AM</h3></div>${sp(S_FAST,'#eab308')}<p style="color:var(--text3);font-size:.72rem;margin-top:8px">Tomar com copo grande de água. Esperar 30min antes de comer.</p></div>
  <div class="card"><div class="card-header"><div class="icon" style="background:var(--accent-glow)">🍳</div><h3>Café da Manhã — 7:30–8 AM</h3></div>${sp(S_BRK,'#22c55e')}<p style="color:var(--text3);font-size:.72rem;margin-top:8px">Tomar COM a refeição.</p></div>
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(59,130,246,.12)">🍛</div><h3>Almoço — 12:30 PM</h3></div>${sp(S_LUN,'#3b82f6')}</div>
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(168,85,247,.12)">🌙</div><h3>Noite — 9:30 PM</h3></div>${sp(S_NIT,'#a855f7')}<p style="color:var(--text3);font-size:.72rem;margin-top:8px">Tomar com chá de camomila.</p></div>`;

// ===== TAB: DIA A DIA (original combined view) =====
let diaDiaSelected='seg';
function buildDiaDia(preselect){
  if(preselect)diaDiaSelected=preselect;
  const d=diaDiaSelected;
  const eff=getEffectiveType(d);
  const dayLabel={seg:'Segunda',ter:'Terça',qua:'Quarta',qui:'Quinta',sex:'Sexta',sab:'Sábado',dom:'Domingo'}[d];
  const isOff=eff==='off';
  return `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px">
    ${['seg','ter','qua','qui','sex','sab','dom'].map(dd=>`<button style="padding:6px 12px;border-radius:20px;border:1px solid ${dd===d?'var(--accent)':'var(--border)'};background:${dd===d?'var(--accent)':'var(--surface)'};color:${dd===d?'var(--bg)':'var(--text3)'};font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:${dd===d?'700':'500'};cursor:pointer" onclick="diaDiaSelected='${dd}';renderTab('diadia')">${dd.toUpperCase()}</button>`).join('')}
  </div>
  <div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:.88rem;font-weight:700">${dayLabel}</span>${!isOff?buildSwapBtn(d):''}</div>
  ${!isOff?buildTimerBar(d):''}
  ${getWorkoutContent(eff,d)}
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(34,197,94,.12)">🍽️</div><h3>Alimentação — ${dayLabel}</h3></div>${getMealsForType(eff)}</div>
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(168,85,247,.12)">💊</div><h3>Suplementos — ${dayLabel}</h3></div>
    <div class="section-title" style="padding-top:4px">☀️ Jejum (7 AM)</div>${sp(S_FAST,'#eab308')}
    <div class="section-title">🍳 Café (7:30–8 AM)</div>${sp(S_BRK,'#22c55e')}
    <div class="section-title">🍛 Almoço (12:30 PM)</div>${sp(S_LUN,'#3b82f6')}
    <div class="section-title">🌙 Noite (9:30 PM)</div>${sp(S_NIT,'#a855f7')}
  </div>`;
}

// ===== TAB: METAS =====
function buildMetas(){
  return `<div class="card">
    <div class="card-header"><div class="icon" style="background:rgba(59,130,246,.12)">🏃</div><h3>5K sub-30 min</h3></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-xs);margin-bottom:8px">
      <span style="font-size:.85rem">Pace atual</span><span style="font-family:'JetBrains Mono',monospace;color:var(--blue);font-weight:600">6:30/km</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-xs)">
      <span style="font-size:.85rem">Pace meta</span><span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">5:59/km</span></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="icon" style="background:rgba(239,68,68,.12)">⚖️</div><h3>Perder 4kg</h3></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-xs);margin-bottom:8px">
      <span style="font-size:.85rem">Peso atual</span>
      <div style="display:flex;align-items:center;gap:4px"><input class="edit-val" type="number" step="0.1" value="${STATE.weight}" onchange="STATE.weight=parseFloat(this.value);save();renderTab('metas')"> <span style="font-size:.78rem;color:var(--text3)">kg</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-xs);margin-bottom:8px">
      <span style="font-size:.85rem">Peso meta</span>
      <div style="display:flex;align-items:center;gap:4px"><input class="edit-val" type="number" step="0.1" value="${STATE.goalWeight}" onchange="STATE.goalWeight=parseFloat(this.value);save();renderTab('metas')"> <span style="font-size:.78rem;color:var(--text3)">kg</span></div>
    </div>
    <div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--text3);margin-bottom:4px"><span>${STATE.goalWeight}kg</span><span>${STATE.weight}kg</span></div>
    <div style="height:12px;background:var(--surface2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.max(0,Math.min(100,((72-STATE.weight)/(72-STATE.goalWeight))*100))}%;background:linear-gradient(90deg,var(--red),var(--orange));border-radius:6px;transition:width .5s"></div></div></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="icon" style="background:rgba(34,197,94,.12)">💪</div><h3>Hipertrofia</h3></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-xs);margin-bottom:8px">
      <span style="font-size:.85rem">Déficit calórico</span><span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">-400 kcal/dia</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-xs)">
      <span style="font-size:.85rem">Proteína diária</span><span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">155g</span></div>

// ===== TAB: SONO =====
function buildSleep(){
  return `<div class="card">
    <div class="card-header"><div class="icon" style="background:rgba(168,85,247,.12)">😴</div><h3>Protocolo de Sono</h3><span class="tag" style="background:rgba(168,85,247,.15);color:var(--purple)">7.5–8h</span></div>
    ${[['9:30 PM','<strong>Última refeição + Supps noturnos</strong>'],['10 PM','<strong>Desligar telas</strong> ou Night Shift. Luz baixa. Chá camomila.'],['10:30 PM','<strong>Wind down:</strong> Leitura, alongamento, respiração 4-7-8'],['11 PM','<strong>Cama, luzes apagadas.</strong> Meta: dormir 11:15 PM'],['7 AM','<strong>Acordar.</strong> Luz solar 10 min. 500ml água.']].map(([t,d])=>`<div class="sleep-item"><div class="sleep-time" style="${t==='7 AM'?'color:var(--accent)':''}">${t}</div><p>${d}</p></div>`).join('')}
  </div>
  <div class="card"><div class="card-header"><div class="icon" style="background:rgba(6,182,212,.12)">💡</div><h3>Dicas</h3></div>
    <div style="display:grid;gap:8px">
      ${[['🌡️','Quarto 18-20°C, escuro'],['☕','Último café até 3 PM'],['💊','Ashwagandha + Neuro-Mag à noite'],['🍷','Álcool: dormir 30min mais cedo'],['⏰','Consistência nos fins de semana'],['📱','Modo avião às 10 PM']].map(([e,t])=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--surface2);border-radius:var(--radius-xs)"><span style="flex-shrink:0">${e}</span><span style="font-size:.82rem;color:var(--text2)">${t}</span></div>`).join('')}

// ===== RENDER ENGINE =====
const nav=document.getElementById('nav'),main=document.getElementById('main');
let currentTab='home';
TABS.forEach(t=>{const btn=document.createElement('button');btn.textContent=t.label;btn.dataset.id=t.id;btn.onclick=()=>switchTab(t.id);nav.appendChild(btn)});

function renderTab(id,param){
  let h='';
  switch(id){
    case'home':h=buildHome();break;
    case'treino':h=buildTreino();break;
    case'alimentacao':h=buildAlimentacao();break;
    case'suplementos':h=buildSupplementos();break;
    case'diadia':h=buildDiaDia(param);break;
    case'metas':h=buildMetas();break;
    case'sleep':h=buildSleep();break;
  }
  main.innerHTML=`<div class="tab-content active">${h}</div>`;
}

function switchTab(id,param){
  currentTab=id;
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  renderTab(id,param);
  window.scrollTo({top:0,behavior:'smooth'});
}
switchTab('home');

// ===== GLOBAL FUNCTIONS =====
function loadYT(el,id){el.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>`}
function saveWeight(name,val){STATE.exWeights[name]=val;save()}
</script>

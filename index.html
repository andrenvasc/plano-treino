.meal{display:grid;grid-template-columns:auto 1fr;gap:0 16px;padding:14px 0;border-bottom:1px solid var(--border)}.meal:last-child{border-bottom:none}.meal .time-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}.meal .time-emoji{font-size:1.3rem}.meal .time{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text3)}.meal .meal-info h4{font-size:.92rem;font-weight:600;margin-bottom:4px}.meal .meal-info p{color:var(--text2);font-size:.82rem;line-height:1.6}.meal .macros{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.macro-tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;padding:3px 8px;border-radius:4px;background:var(--surface2)}.macro-tag.p{color:#22c55e;border:1px solid rgba(34,197,94,.2)}.macro-tag.c{color:#3b82f6;border:1px solid rgba(59,130,246,.2)}.macro-tag.f{color:#f97316;border:1px solid rgba(249,115,22,.2)}.macro-tag.kcal{color:#eab308;border:1px solid rgba(234,179,8,.2)}

.pace-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem}.pace-table th{text-align:left;padding:8px 12px;background:var(--surface3);color:var(--accent);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}.pace-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text2)}.pace-table tr:last-child td{border-bottom:none}

// RENDER
const nav=document.getElementById('nav'),main=document.getElementById('main');
DAYS.forEach(d=>{const btn=document.createElement('button');btn.textContent=d.id==='overview'||d.id==='sleep'?d.short:`${d.emoji} ${d.label}`;btn.dataset.id=d.id;btn.onclick=()=>switchTab(d.id);nav.appendChild(btn)});

function switchTab(id){
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  let h='';
  switch(id){
    case'overview':h=buildOverview();break;
    case'seg':h=buildSeg();break;
    case'ter':h=buildCorrida('ter');break;
    case'qua':h=buildCorrida('qua');break;
    case'qui':h=buildQui();break;
    case'sex':h=buildOff('sex');break;
    case'sab':h=buildSab();break;
    case'dom':h=buildOff('dom');break;
    case'sleep':h=buildSleep();break;
  }
  main.innerHTML=`<div class="day-section active">${h}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
switchTab('overview');

function loadYT(el,id){
  el.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
}
